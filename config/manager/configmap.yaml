apiVersion: v1
kind: ConfigMap
metadata:
  name: influx-log-viewer-config
  namespace: influxdb3
  labels:
    app.kubernetes.io/name: influx-log-viewer
data:
  HTTP_ADDR: ":8080"
  INFLUXDB_URL: "http://db3-influxdb3-enterprise-ingester.influxdb3.svc.cluster.local:8181"
  INFLUXDB_QUERY_URL: "http://db3-influxdb3-enterprise-querier.influxdb3.svc.cluster.local:8181"
  INFLUXDB_DATABASE: "logs"
