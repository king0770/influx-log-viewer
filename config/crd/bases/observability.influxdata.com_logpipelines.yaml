apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: logpipelines.observability.influxdata.com
spec:
  group: observability.influxdata.com
  names:
    kind: LogPipeline
    listKind: LogPipelineList
    plural: logpipelines
    singular: logpipeline
    shortNames: [lp]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Target
          type: string
          jsonPath: .spec.targetNamespace
        - name: Database
          type: string
          jsonPath: .spec.database
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              properties:
                targetNamespace:
                  type: string
                  default: influxdb3
                  minLength: 1
                podSelector:
                  type: object
                  additionalProperties: {type: string}
                influxURL:
                  type: string
                  format: uri
                database:
                  type: string
                  default: logs
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
                batchSize:
                  type: integer
                  format: int32
                  default: 500
                  minimum: 1
                  maximum: 10000
                flushInterval:
                  type: string
                  default: 1s
                  pattern: '^[0-9]+(ms|s|m|h)$'
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
                lastTransitionTime: {type: string, format: date-time}
